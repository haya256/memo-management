<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<!-- ブラウザから保存する先のリポジトリ（owner/repo）。空なら <owner>.github.io/<repo>/ の URL から判定する -->
<meta name="memo-repo" content="">
<title>メモ</title>
<style>
  :root { --memo-font-size: 16px; }
  body { max-width: 720px; margin: 0 auto; padding: 16px; font-family: system-ui, sans-serif; line-height: 1.7; }
  pre { white-space: pre-wrap; word-wrap: break-word; font-family: inherit; font-size: var(--memo-font-size); margin: 0 0 16px; }
  form, .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  input { flex: 1; min-width: 0; font-size: 16px; padding: 6px 8px; }
  #name { box-sizing: border-box; width: 100%; margin-bottom: 8px; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  textarea { box-sizing: border-box; width: 100%; min-height: 60vh; font: inherit; font-size: max(16px, var(--memo-font-size)); padding: 8px; margin-bottom: 8px; }
  button { font-size: 16px; padding: 6px 12px; }
  .error { color: #c00; }
  .note { font-size: 14px; color: #666; margin: 0 0 8px; }
  #setup-note { flex-basis: 100%; margin: 0; }
  [hidden] { display: none !important; }
  /* 読書モード */
  #reader { position: fixed; inset: 0; z-index: 10; background: #fff; color: #000; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  #reader-viewport { position: absolute; left: 0; right: 0; top: calc(28px + env(safe-area-inset-top)); bottom: calc(36px + env(safe-area-inset-bottom)); overflow: hidden; }
  #reader-content { position: absolute; top: 0; white-space: pre-wrap; overflow-wrap: anywhere; font-size: var(--memo-font-size); line-height: 1.8; column-fill: auto; will-change: transform; }
  #reader-page { position: absolute; left: 0; right: 0; bottom: calc(10px + env(safe-area-inset-bottom)); text-align: center; font-size: 12px; color: #888; }
  #reader-menu { position: absolute; top: 0; left: 0; right: 0; display: flex; gap: 8px; align-items: center; padding: calc(8px + env(safe-area-inset-top)) 12px 8px; background: #fff; border-bottom: 1px solid #ddd; }
  #reader-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: bold; }
  .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<form id="unlock">
  <p id="setup-note" class="note" hidden></p>
  <!-- パスワードマネージャー用のユーザー名（画面には出さない） -->
  <input class="visually-hidden" id="username" name="username" type="text" value="memo" autocomplete="username" tabindex="-1" aria-hidden="true">
  <input id="passphrase" name="passphrase" type="password" placeholder="パスフレーズ" autocomplete="current-password" autofocus required>
  <input id="passphrase2" name="passphrase2" type="password" placeholder="もう一度" autocomplete="new-password" hidden>
  <button id="unlock-button" type="submit">開く</button>
</form>

<p id="status"></p>

<section id="list" hidden>
  <ul id="memos"></ul>
  <div class="actions"><button id="new">新規</button></div>
</section>

<section id="view" hidden>
  <h1 id="view-name"></h1>
  <pre id="memo"></pre>
  <div class="actions">
    <button id="edit">編集</button>
    <button id="read" type="button">読書</button>
    <button id="back" type="button">一覧へ戻る</button>
    <button class="font-smaller" type="button" aria-label="文字を小さく" title="文字を小さく">A−</button>
    <button class="font-larger" type="button" aria-label="文字を大きく" title="文字を大きく">A+</button>
  </div>
</section>

<div id="reader" hidden>
  <div id="reader-viewport"><div id="reader-content"></div></div>
  <div id="reader-page"></div>
  <div id="reader-menu">
    <span id="reader-title"></span>
    <button class="font-smaller" type="button" aria-label="文字を小さく" title="文字を小さく">A−</button>
    <button class="font-larger" type="button" aria-label="文字を大きく" title="文字を大きく">A+</button>
    <button id="reader-close" type="button">閉じる</button>
  </div>
</div>

<section id="editor" hidden>
  <input id="name" name="memo-name" type="text" placeholder="名前" autocomplete="off" data-1p-ignore>
  <textarea id="text"></textarea>
  <div class="actions">
    <button id="save">保存</button>
    <button id="cancel" type="button">キャンセル</button>
    <button id="delete" type="button">削除</button>
    <button class="font-smaller" type="button" aria-label="文字を小さく" title="文字を小さく">A−</button>
    <button class="font-larger" type="button" aria-label="文字を大きく" title="文字を大きく">A+</button>
  </div>
  <form id="token-form" hidden>
    <p class="note" id="token-note"></p>
    <input id="token" name="token" type="password" placeholder="github_pat_…" autocomplete="off" data-1p-ignore required>
    <button type="submit">トークンを保存して続ける</button>
  </form>
</section>

<script type="module">
  import { encryptMemo, decryptMemo, parseMemos, serializeMemos, MIN_PASSPHRASE_LENGTH } from './memo-crypto.js';

  // 保存先リポジトリ（owner/repo）。meta で指定がなければ GitHub Pages の URL から判定する
  function detectRepo() {
    const meta = document.querySelector('meta[name="memo-repo"]')?.content.trim();
    if (meta) return meta;
    const m = location.hostname.match(/^([^.]+)\.github\.io$/i);
    if (!m) return null;
    const dir = location.pathname.split('/').slice(1, -1)[0];
    return `${m[1]}/${dir || location.hostname}`; // ディレクトリなしならユーザーサイト（<owner>.github.io リポジトリ）
  }

  const REPO = detectRepo();
  const API = REPO && `https://api.github.com/repos/${REPO}/contents/memo.enc`;
  // 同じ <owner>.github.io の別リポジトリと localStorage を共有するので、リポジトリごとに分ける
  const TOKEN_KEY = `memo-management:${REPO}:token`;

  const $ = id => document.getElementById(id);
  const status = $('status');

  let passphrase = null;
  let token = null;
  let loadedEnc = null; // 読み込んだ memo.enc の生テキスト（衝突検知に使う）
  let memos = [];       // [{ name, text }]
  let current = null;   // 表示・編集中のメモの添字（新規作成中は null）
  let pending = null;   // トークン入力後に続ける保存処理
  let setup = false;    // memo.enc がまだない（初回セットアップ）

  // --- 本文の文字サイズ（このブラウザに保存） ---

  const FONT_KEY = `memo-management:${REPO}:fontSize`;
  const FONT_MIN = 12, FONT_MAX = 32, FONT_STEP = 2, FONT_DEFAULT = 16;
  let fontSize = FONT_DEFAULT;
  try {
    const n = Number(localStorage.getItem(FONT_KEY));
    if (n >= FONT_MIN && n <= FONT_MAX) fontSize = n;
  } catch {}

  function applyFontSize() {
    document.documentElement.style.setProperty('--memo-font-size', `${fontSize}px`);
    for (const b of document.querySelectorAll('.font-smaller')) b.disabled = fontSize <= FONT_MIN;
    for (const b of document.querySelectorAll('.font-larger')) b.disabled = fontSize >= FONT_MAX;
  }

  function changeFontSize(delta) {
    fontSize = Math.min(FONT_MAX, Math.max(FONT_MIN, fontSize + delta));
    applyFontSize();
    if (readerOn) layoutReader();
    try { localStorage.setItem(FONT_KEY, String(fontSize)); } catch {}
  }

  for (const b of document.querySelectorAll('.font-smaller')) b.addEventListener('click', () => changeFontSize(-FONT_STEP));
  for (const b of document.querySelectorAll('.font-larger')) b.addEventListener('click', () => changeFontSize(FONT_STEP));
  applyFontSize();

  if (REPO) $('username').value = REPO.split('/')[1];
  $('token-note').textContent = `保存には GitHub のトークン（${REPO} の Contents 読み書き権限）が必要です。パスフレーズで暗号化してこのブラウザに保存します。`;

  function showStatus(message, isError = false) {
    status.textContent = message;
    status.className = isError ? 'error' : '';
  }

  function showOnly(id) {
    for (const s of ['list', 'view', 'editor']) $(s).hidden = s !== id;
  }

  function showList() {
    const ul = $('memos');
    ul.replaceChildren(...memos.map((m, i) => {
      const li = document.createElement('li');
      const a = document.createElement('a');
      a.href = '#';
      a.textContent = m.name;
      a.addEventListener('click', e => { e.preventDefault(); showStatus(''); showView(i); });
      li.append(a);
      return li;
    }));
    current = null;
    showOnly('list');
  }

  function showView(i) {
    current = i;
    $('view-name').textContent = memos[i].name;
    $('memo').textContent = memos[i].text;
    showOnly('view');
  }

  function showEditor() {
    const memo = current === null ? { name: '', text: '' } : memos[current];
    $('name').value = memo.name;
    $('text').value = memo.text;
    $('delete').hidden = current === null;
    $('token-form').hidden = true;
    showOnly('editor');
    (current === null ? $('name') : $('text')).focus();
  }

  function isDirty() {
    const memo = current === null ? { name: '', text: '' } : memos[current];
    return $('name').value !== memo.name || $('text').value !== memo.text;
  }

  // --- 読書モード ---
  // 本文を CSS の段組みで「1 段 = 1 画面」に流し込み、段の幅ずつ横にずらしてページをめくる

  const reader = $('reader');
  const rv = $('reader-viewport');
  const rc = $('reader-content');
  const POS_KEY = `memo-management:${REPO}:reading`;
  const range = document.createRange();
  let readerOn = false;
  let page = 0, pages = 1;
  let stride = 0;       // 1 ページ分の横幅（px）
  let anchor = 0;       // 今のページの先頭の文字位置。文字サイズや画面幅が変わってもここを含むページを表示する
  let readerKey = null; // 読んだ位置を保存するキー（メモ名のハッシュ。名前そのものはブラウザに残さない）
  let drag = null;

  const textLength = () => rc.firstChild?.length ?? 0;

  // 文字 i がある段（ページ）。改行などで位置が取れない文字は次の文字で見る
  function colAt(i) {
    const node = rc.firstChild, n = textLength(), origin = rc.getBoundingClientRect().left;
    for (; i < n; i++) {
      range.setStart(node, i);
      range.setEnd(node, i + 1);
      const r = range.getClientRects()[0];
      if (r) return Math.floor((r.left - origin + 1) / stride);
    }
    return null;
  }

  function lastCol() {
    const node = rc.firstChild, origin = rc.getBoundingClientRect().left;
    for (let i = textLength() - 1; i >= 0; i--) {
      range.setStart(node, i);
      range.setEnd(node, i + 1);
      const r = range.getClientRects()[0];
      if (r) return Math.floor((r.left - origin + 1) / stride);
    }
    return 0;
  }

  // ページ p の先頭の文字位置（二分探索）
  function offsetForPage(p) {
    let lo = 0, hi = textLength();
    while (lo < hi) {
      const mid = (lo + hi) >> 1, c = colAt(mid);
      if (c === null || c >= p) hi = mid; else lo = mid + 1;
    }
    return lo;
  }

  function setTranslate(x, animate) {
    rc.style.transition = animate ? 'transform .3s ease-out' : 'none';
    rc.style.transform = `translateX(${x}px)`;
  }

  function layoutReader() {
    const w = rv.clientWidth, h = rv.clientHeight;
    if (!w || !h) return;
    const pad = Math.min(32, Math.max(16, Math.round(w * 0.06)));
    stride = w; // 段の幅 + 段の間隔 = 画面幅。左右の余白が隣のページとの間隔になる
    Object.assign(rc.style, {
      left: `${pad}px`, width: `${w - 2 * pad}px`, height: `${h}px`,
      columnWidth: `${w - 2 * pad}px`, columnGap: `${2 * pad}px`,
    });
    const n = textLength();
    pages = n ? lastCol() + 1 : 1;
    page = n ? Math.min(pages - 1, colAt(Math.min(anchor, n - 1)) ?? pages - 1) : 0;
    setTranslate(-page * stride, false);
    $('reader-page').textContent = `${page + 1} / ${pages}`;
  }

  function loadPositions() {
    try { return JSON.parse(localStorage.getItem(POS_KEY)) || {}; } catch { return {}; }
  }

  function goTo(p) {
    p = Math.max(0, Math.min(pages - 1, p));
    if (p !== page) $('reader-menu').hidden = true; // めくったらメニューを閉じる（真ん中のタップでまた出る）
    page = p;
    setTranslate(-page * stride, true);
    anchor = offsetForPage(page);
    $('reader-page').textContent = `${page + 1} / ${pages}`;
    if (readerKey) {
      const positions = loadPositions();
      positions[readerKey] = anchor;
      try { localStorage.setItem(POS_KEY, JSON.stringify(positions)); } catch {}
    }
  }

  async function memoKey(name) {
    const hash = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(name));
    return btoa(String.fromCharCode(...new Uint8Array(hash))).slice(0, 22);
  }

  async function openReader() {
    const memo = memos[current];
    readerKey = await memoKey(memo.name);
    anchor = Math.min(Number(loadPositions()[readerKey]) || 0, memo.text.length);
    rc.textContent = memo.text;
    $('reader-title').textContent = memo.name;
    $('reader-menu').hidden = false;
    reader.hidden = false;
    readerOn = true;
    document.body.style.overflow = 'hidden';
    document.activeElement?.blur();
    layoutReader();
  }

  function closeReader() {
    readerOn = false;
    drag = null;
    reader.hidden = true;
    rc.textContent = '';
    document.body.style.overflow = '';
    $('read').focus();
  }

  // 画面の左右 3 割をタップでめくる。真ん中はメニューの表示・非表示
  function tap(x) {
    const w = reader.clientWidth;
    if (x < w * 0.3) goTo(page - 1);
    else if (x > w * 0.7) goTo(page + 1);
    else $('reader-menu').hidden = !$('reader-menu').hidden;
  }

  reader.addEventListener('pointerdown', e => {
    if (!e.isPrimary || e.target.closest('button')) return;
    drag = { x: e.clientX, y: e.clientY, t: e.timeStamp, moving: false };
    reader.setPointerCapture(e.pointerId);
  });

  reader.addEventListener('pointermove', e => {
    if (!drag) return;
    let dx = e.clientX - drag.x;
    if (!drag.moving && Math.abs(dx) < 5) return;
    drag.moving = true;
    if ((page === 0 && dx > 0) || (page === pages - 1 && dx < 0)) dx /= 3; // 端では引っ張りを重くする
    setTranslate(-page * stride + dx, false);
  });

  reader.addEventListener('pointerup', e => {
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y, dt = e.timeStamp - drag.t;
    drag = null;
    if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return tap(e.clientX);
    const flick = Math.abs(dx) > stride * 0.2 || (Math.abs(dx) > 30 && dt < 300);
    goTo(Math.abs(dx) > Math.abs(dy) && flick ? page + (dx < 0 ? 1 : -1) : page);
  });

  reader.addEventListener('pointercancel', () => {
    if (!drag) return;
    drag = null;
    goTo(page);
  });

  document.addEventListener('keydown', e => {
    if (!readerOn) return;
    if (['ArrowRight', 'ArrowDown', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); goTo(page + 1); }
    else if (['ArrowLeft', 'ArrowUp', 'PageUp'].includes(e.key)) { e.preventDefault(); goTo(page - 1); }
    else if (e.key === 'Escape') closeReader();
  });

  new ResizeObserver(() => { if (readerOn) layoutReader(); }).observe(rv);
  $('read').addEventListener('click', openReader);
  $('reader-close').addEventListener('click', closeReader);

  // --- トークン（パスフレーズで暗号化して localStorage に保存） ---

  async function loadToken() {
    let stored;
    try { stored = localStorage.getItem(TOKEN_KEY); } catch { return null; }
    if (!stored) return null;
    try {
      return await decryptMemo(JSON.parse(stored), passphrase);
    } catch {
      return null; // パスフレーズが変わった等。保存時に入れ直してもらう
    }
  }

  async function storeToken(value) {
    token = value;
    try { localStorage.setItem(TOKEN_KEY, JSON.stringify(await encryptMemo(value, passphrase))); } catch {}
  }

  function forgetToken() {
    token = null;
    try { localStorage.removeItem(TOKEN_KEY); } catch {}
  }

  // --- GitHub API ---

  async function github(method, body) {
    const res = await fetch(API, {
      method,
      cache: 'no-store',
      headers: {
        Authorization: `Bearer ${token}`,
        Accept: 'application/vnd.github+json',
        'X-GitHub-Api-Version': '2022-11-28',
      },
      body: body && JSON.stringify(body),
    });
    if (res.status === 404 && method === 'GET') return null;
    if (res.status === 401 || res.status === 403) {
      forgetToken();
      throw new Error('トークンが無効か権限が足りません。入れ直してください');
    }
    if (res.status === 409) throw new Error('他の場所で更新されています。再読み込みしてください');
    if (!res.ok) throw new Error(`GitHub API エラー: ${res.status}`);
    return res.json();
  }

  async function fetchRemote() {
    const file = await github('GET');
    return file && { sha: file.sha, enc: atob(file.content.replace(/\n/g, '')) };
  }

  // --- 読み込み ---

  // memo.enc がなければ null
  async function fetchEnc() {
    // トークンがあれば API から最新を取る（Pages は反映が 1 分ほど遅れる）
    if (token) {
      try {
        const remote = await fetchRemote();
        if (remote) return remote.enc;
      } catch {}
    }
    const res = await fetch('memo.enc', { cache: 'no-store' });
    if (res.status === 404) return null;
    if (!res.ok) throw new Error(res.status + ' ' + res.statusText);
    return res.text();
  }

  function enterSetup() {
    setup = true;
    $('setup-note').textContent = `メモがまだありません。新しいパスフレーズを決めてください（${MIN_PASSPHRASE_LENGTH} 文字以上。忘れるとメモは復元できません）。`;
    $('setup-note').hidden = false;
    $('passphrase').autocomplete = 'new-password';
    $('passphrase2').hidden = false;
    $('passphrase2').required = true;
    $('unlock-button').textContent = 'はじめる';
  }

  async function startSetup() {
    const value = $('passphrase').value;
    if (value.length < MIN_PASSPHRASE_LENGTH) return showStatus(`パスフレーズは ${MIN_PASSPHRASE_LENGTH} 文字以上にしてください`, true);
    if (value !== $('passphrase2').value) return showStatus('パスフレーズが一致しません', true);
    passphrase = value;
    token = await loadToken();
    loadedEnc = null;
    memos = [];
    $('unlock').hidden = true;
    showStatus('「新規」からメモを作ってください。最初の保存で memo.enc が作られます');
    showList();
  }

  $('unlock').addEventListener('submit', async e => {
    e.preventDefault();
    if (setup) return startSetup();
    showStatus('復号中…');
    passphrase = $('passphrase').value;
    token = await loadToken();
    try {
      loadedEnc = await fetchEnc();
      if (loadedEnc === null) throw new Error('memo.enc がありません');
    } catch (err) {
      showStatus('メモを読み込めませんでした: ' + err.message, true);
      return;
    }
    try {
      memos = parseMemos(await decryptMemo(JSON.parse(loadedEnc), passphrase));
    } catch {
      passphrase = null;
      token = null;
      showStatus('パスフレーズが違います', true);
      $('passphrase').select();
      return;
    }
    $('passphrase').value = '';
    $('unlock').hidden = true;
    showStatus('');
    showList();
  });

  // --- 編集・保存 ---

  $('new').addEventListener('click', () => { showStatus(''); current = null; showEditor(); });
  $('edit').addEventListener('click', showEditor);
  $('back').addEventListener('click', () => { showStatus(''); showList(); });

  $('cancel').addEventListener('click', () => {
    if (isDirty() && !confirm('変更を破棄しますか？')) return;
    showStatus('');
    current === null ? showList() : showView(current);
  });

  // newMemos を暗号化して memo.enc をコミットし、成功したら done() を呼ぶ
  async function commit(newMemos, message, done) {
    if (!API) {
      showStatus('保存先のリポジトリがわかりません。index.html の memo-repo に owner/repo を設定してください', true);
      return;
    }
    if (!token) {
      pending = () => commit(newMemos, message, done);
      $('token-form').hidden = false;
      $('token').focus();
      return;
    }
    $('save').disabled = $('delete').disabled = true;
    showStatus('保存中…');
    try {
      const plaintext = serializeMemos(newMemos);
      const remote = await fetchRemote();
      if ((remote?.enc ?? null) !== loadedEnc) throw new Error('他の場所で更新されています。内容を控えてから再読み込みしてください');
      const newEnc = JSON.stringify(await encryptMemo(plaintext, passphrase), null, 2) + '\n';
      await github('PUT', { message, content: btoa(newEnc), sha: remote?.sha }); // sha なしなら新規作成
      loadedEnc = newEnc;
      memos = newMemos;
      showStatus('保存しました（公開ページへの反映は 1 分ほどかかります）');
      done();
    } catch (err) {
      showStatus('保存できませんでした: ' + err.message, true);
      if (!token) {
        pending = () => commit(newMemos, message, done);
        $('token-form').hidden = false;
      }
    } finally {
      $('save').disabled = $('delete').disabled = false;
    }
  }

  function save() {
    const memo = { name: $('name').value.trim(), text: $('text').value };
    const newMemos = [...memos];
    const i = current === null ? newMemos.length : current;
    newMemos[i] = memo;
    commit(newMemos, 'Update memo', () => showView(i));
  }

  function remove() {
    if (!confirm(`「${memos[current].name}」を削除しますか？`)) return;
    commit(memos.filter((_, i) => i !== current), 'Delete memo', showList);
  }

  $('save').addEventListener('click', save);
  $('delete').addEventListener('click', remove);

  $('token-form').addEventListener('submit', async e => {
    e.preventDefault();
    await storeToken($('token').value.trim());
    $('token').value = '';
    $('token-form').hidden = true;
    const p = pending;
    pending = null;
    p?.();
  });

  window.addEventListener('beforeunload', e => {
    if (!$('editor').hidden && isDirty()) e.preventDefault();
  });

  try {
    if (await fetchEnc() === null) enterSetup();
  } catch {} // 開くときに改めて読み込んでエラーを出す
</script>
