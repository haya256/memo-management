<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>メモ</title>
<style>
  body { max-width: 720px; margin: 0 auto; padding: 16px; font-family: system-ui, sans-serif; line-height: 1.7; }
  pre { white-space: pre-wrap; word-wrap: break-word; font-family: inherit; margin: 0; }
  .error { color: #c00; }
</style>
</head>
<body>
<pre id="memo">読み込み中…</pre>
<script>
  const el = document.getElementById('memo');
  fetch('memo.txt', { cache: 'no-store' })
    .then(res => {
      if (!res.ok) throw new Error(res.status + ' ' + res.statusText);
      return res.text();
    })
    .then(text => { el.textContent = text; })
    .catch(err => {
      el.textContent = 'メモを読み込めませんでした: ' + err.message;
      el.className = 'error';
    });
</script>
</body>
</html>
