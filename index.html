<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>メモ</title>
<style>
  body { max-width: 720px; margin: 0 auto; padding: 16px; font-family: system-ui, sans-serif; line-height: 1.7; }
  pre { white-space: pre-wrap; word-wrap: break-word; font-family: inherit; margin: 0 0 16px; }
  form, .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  input { flex: 1; min-width: 0; font-size: 16px; padding: 6px 8px; }
  #name { box-sizing: border-box; width: 100%; margin-bottom: 8px; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  textarea { box-sizing: border-box; width: 100%; min-height: 60vh; font: inherit; font-size: 16px; padding: 8px; margin-bottom: 8px; }
  button { font-size: 16px; padding: 6px 12px; }
  .error { color: #c00; }
  .note { font-size: 14px; color: #666; margin: 0 0 8px; }
  [hidden] { display: none !important; }
  .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<form id="unlock">
  <!-- パスワードマネージャー用のユーザー名（画面には出さない） -->
  <input class="visually-hidden" name="username" type="text" value="memo-management" autocomplete="username" tabindex="-1" aria-hidden="true">
  <input id="passphrase" name="passphrase" type="password" placeholder="パスフレーズ" autocomplete="current-password" autofocus required>
  <button type="submit">開く</button>
</form>

<p id="status"></p>

<section id="list" hidden>
  <ul id="memos"></ul>
  <div class="actions"><button id="new">新規</button></div>
</section>

<section id="view" hidden>
  <h1 id="view-name"></h1>
  <pre id="memo"></pre>
  <div class="actions">
    <button id="edit">編集</button>
    <button id="back" type="button">一覧へ戻る</button>
  </div>
</section>

<section id="editor" hidden>
  <input id="name" name="memo-name" type="text" placeholder="名前" autocomplete="off" data-1p-ignore>
  <textarea id="text"></textarea>
  <div class="actions">
    <button id="save">保存</button>
    <button id="cancel" type="button">キャンセル</button>
    <button id="delete" type="button">削除</button>
  </div>
  <form id="token-form" hidden>
    <p class="note">保存には GitHub のトークン（memo-management の Contents 読み書き権限）が必要です。パスフレーズで暗号化してこのブラウザに保存します。</p>
    <input id="token" name="token" type="password" placeholder="github_pat_…" autocomplete="off" data-1p-ignore required>
    <button type="submit">トークンを保存して続ける</button>
  </form>
</section>

<script type="module">
  import { encryptMemo, decryptMemo, parseMemos, serializeMemos } from './memo-crypto.js';

  const API = 'https://api.github.com/repos/haya256/memo-management/contents/memo.enc';
  const TOKEN_KEY = 'memo-management:token';

  const $ = id => document.getElementById(id);
  const status = $('status');

  let passphrase = null;
  let token = null;
  let loadedEnc = null; // 読み込んだ memo.enc の生テキスト（衝突検知に使う）
  let memos = [];       // [{ name, text }]
  let current = null;   // 表示・編集中のメモの添字（新規作成中は null）
  let pending = null;   // トークン入力後に続ける保存処理

  function showStatus(message, isError = false) {
    status.textContent = message;
    status.className = isError ? 'error' : '';
  }

  function showOnly(id) {
    for (const s of ['list', 'view', 'editor']) $(s).hidden = s !== id;
  }

  function showList() {
    const ul = $('memos');
    ul.replaceChildren(...memos.map((m, i) => {
      const li = document.createElement('li');
      const a = document.createElement('a');
      a.href = '#';
      a.textContent = m.name;
      a.addEventListener('click', e => { e.preventDefault(); showStatus(''); showView(i); });
      li.append(a);
      return li;
    }));
    current = null;
    showOnly('list');
  }

  function showView(i) {
    current = i;
    $('view-name').textContent = memos[i].name;
    $('memo').textContent = memos[i].text;
    showOnly('view');
  }

  function showEditor() {
    const memo = current === null ? { name: '', text: '' } : memos[current];
    $('name').value = memo.name;
    $('text').value = memo.text;
    $('delete').hidden = current === null;
    $('token-form').hidden = true;
    showOnly('editor');
    (current === null ? $('name') : $('text')).focus();
  }

  function isDirty() {
    const memo = current === null ? { name: '', text: '' } : memos[current];
    return $('name').value !== memo.name || $('text').value !== memo.text;
  }

  // --- トークン（パスフレーズで暗号化して localStorage に保存） ---

  async function loadToken() {
    let stored;
    try { stored = localStorage.getItem(TOKEN_KEY); } catch { return null; }
    if (!stored) return null;
    try {
      return await decryptMemo(JSON.parse(stored), passphrase);
    } catch {
      return null; // パスフレーズが変わった等。保存時に入れ直してもらう
    }
  }

  async function storeToken(value) {
    token = value;
    try { localStorage.setItem(TOKEN_KEY, JSON.stringify(await encryptMemo(value, passphrase))); } catch {}
  }

  function forgetToken() {
    token = null;
    try { localStorage.removeItem(TOKEN_KEY); } catch {}
  }

  // --- GitHub API ---

  async function github(method, body) {
    const res = await fetch(API, {
      method,
      cache: 'no-store',
      headers: {
        Authorization: `Bearer ${token}`,
        Accept: 'application/vnd.github+json',
        'X-GitHub-Api-Version': '2022-11-28',
      },
      body: body && JSON.stringify(body),
    });
    if (res.status === 401 || res.status === 403) {
      forgetToken();
      throw new Error('トークンが無効か権限が足りません。入れ直してください');
    }
    if (res.status === 409) throw new Error('他の場所で更新されています。再読み込みしてください');
    if (!res.ok) throw new Error(`GitHub API エラー: ${res.status}`);
    return res.json();
  }

  async function fetchRemote() {
    const file = await github('GET');
    return { sha: file.sha, enc: atob(file.content.replace(/\n/g, '')) };
  }

  // --- 読み込み ---

  async function fetchEnc() {
    // トークンがあれば API から最新を取る（Pages は反映が 1 分ほど遅れる）
    if (token) {
      try { return (await fetchRemote()).enc; } catch {}
    }
    const res = await fetch('memo.enc', { cache: 'no-store' });
    if (!res.ok) throw new Error(res.status + ' ' + res.statusText);
    return res.text();
  }

  $('unlock').addEventListener('submit', async e => {
    e.preventDefault();
    showStatus('復号中…');
    passphrase = $('passphrase').value;
    token = await loadToken();
    try {
      loadedEnc = await fetchEnc();
    } catch (err) {
      showStatus('メモを読み込めませんでした: ' + err.message, true);
      return;
    }
    try {
      memos = parseMemos(await decryptMemo(JSON.parse(loadedEnc), passphrase));
    } catch {
      passphrase = null;
      token = null;
      showStatus('パスフレーズが違います', true);
      $('passphrase').select();
      return;
    }
    $('passphrase').value = '';
    $('unlock').hidden = true;
    showStatus('');
    showList();
  });

  // --- 編集・保存 ---

  $('new').addEventListener('click', () => { showStatus(''); current = null; showEditor(); });
  $('edit').addEventListener('click', showEditor);
  $('back').addEventListener('click', () => { showStatus(''); showList(); });

  $('cancel').addEventListener('click', () => {
    if (isDirty() && !confirm('変更を破棄しますか？')) return;
    showStatus('');
    current === null ? showList() : showView(current);
  });

  // newMemos を暗号化して memo.enc をコミットし、成功したら done() を呼ぶ
  async function commit(newMemos, message, done) {
    if (!token) {
      pending = () => commit(newMemos, message, done);
      $('token-form').hidden = false;
      $('token').focus();
      return;
    }
    $('save').disabled = $('delete').disabled = true;
    showStatus('保存中…');
    try {
      const plaintext = serializeMemos(newMemos);
      const remote = await fetchRemote();
      if (remote.enc !== loadedEnc) throw new Error('他の場所で更新されています。内容を控えてから再読み込みしてください');
      const newEnc = JSON.stringify(await encryptMemo(plaintext, passphrase), null, 2) + '\n';
      await github('PUT', { message, content: btoa(newEnc), sha: remote.sha });
      loadedEnc = newEnc;
      memos = newMemos;
      showStatus('保存しました（公開ページへの反映は 1 分ほどかかります）');
      done();
    } catch (err) {
      showStatus('保存できませんでした: ' + err.message, true);
      if (!token) {
        pending = () => commit(newMemos, message, done);
        $('token-form').hidden = false;
      }
    } finally {
      $('save').disabled = $('delete').disabled = false;
    }
  }

  function save() {
    const memo = { name: $('name').value.trim(), text: $('text').value };
    const newMemos = [...memos];
    const i = current === null ? newMemos.length : current;
    newMemos[i] = memo;
    commit(newMemos, 'Update memo', () => showView(i));
  }

  function remove() {
    if (!confirm(`「${memos[current].name}」を削除しますか？`)) return;
    commit(memos.filter((_, i) => i !== current), 'Delete memo', showList);
  }

  $('save').addEventListener('click', save);
  $('delete').addEventListener('click', remove);

  $('token-form').addEventListener('submit', async e => {
    e.preventDefault();
    await storeToken($('token').value.trim());
    $('token').value = '';
    $('token-form').hidden = true;
    const p = pending;
    pending = null;
    p?.();
  });

  window.addEventListener('beforeunload', e => {
    if (!$('editor').hidden && isDirty()) e.preventDefault();
  });
</script>
</body>
</html>
